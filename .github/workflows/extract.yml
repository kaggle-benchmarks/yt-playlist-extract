name: extract
on:
  workflow_dispatch:
permissions: write-all
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch and parse playlist
        run: |
          python3 - <<'EOF'
          import re, json, urllib.request

          UA = {"User-Agent": "facebookexternalhit/1.1 (+http://www.facebook.com/externalhit_uatext.php)"}
          url = "https://www.youtube.com/playlist?list=PLyzTA8cetPdHtlGw1X8Kt7Ea4bd27ApR7&hl=en"
          req = urllib.request.Request(url, headers=UA)
          html = urllib.request.urlopen(req, timeout=60).read().decode("utf-8", "replace")
          m = re.search(r'var ytInitialData = (\{.*?\});</script>', html)
          data = json.loads(m.group(1))

          items = []
          continuations = []
          def walk(o):
              if isinstance(o, dict):
                  if o.get("contentType") == "LOCKUP_CONTENT_TYPE_VIDEO" and "contentId" in o:
                      t = None
                      try:
                          t = o["metadata"]["lockupMetadataViewModel"]["title"]["content"]
                      except Exception:
                          pass
                      items.append((o["contentId"], t))
                  cc = o.get("continuationCommand")
                  if isinstance(cc, dict) and "token" in cc:
                      continuations.append(cc["token"])
                  cvr = o.get("playlistVideoRenderer")
                  if cvr:
                      t = None
                      try:
                          t = cvr["title"]["runs"][0]["text"]
                      except Exception:
                          pass
                      items.append((cvr.get("videoId"), t))
                  civm = o.get("continuationItemViewModel")
                  if civm:
                      walk(civm)
                  for v in o.values():
                      walk(v)
              elif isinstance(o, list):
                  for v in o:
                      walk(v)
          walk(data)

          seen = set()
          out = []
          for vid, t in items:
              if vid and vid not in seen:
                  seen.add(vid)
                  out.append((vid, t))

          log = [f"continuations found: {len(continuations)}"]
          if continuations:
              # try each continuation token until we get new items
              for idx, token in enumerate(continuations):
                  body = json.dumps({
                      "context": {"client": {"clientName": "WEB", "clientVersion": "2.20261023.01.00", "hl": "en", "gl": "US"}},
                      "continuation": token
                  }).encode()
                  api = "https://www.youtube.com/youtubei/v1/browse?key=AIzaSyAO_FJ2SlqU8Q4STEHLGCilw_Y9_11qcW8"
                  req2 = urllib.request.Request(api, data=body, headers={"Content-Type": "application/json", **UA})
                  try:
                      raw = urllib.request.urlopen(req2, timeout=60).read().decode("utf-8", "replace")
                      resp = json.loads(raw)
                      before = len(items)
                      walk(resp)
                      added = 0
                      for vid, t in items:
                          if vid and vid not in seen:
                              seen.add(vid)
                              out.append((vid, t))
                              added += 1
                      log.append(f"cont[{idx}] OK, items in resp: {len(items)-before}, new added: {added}")
                  except Exception as e:
                      log.append(f"cont[{idx}] FAILED: {e}")

          with open("playlist.txt", "w") as f:
              f.write(f"TOTAL: {len(out)}\n")
              for i, (vid, t) in enumerate(out, 1):
                  f.write(f"{i}. {vid} | {t}\n")
              f.write("\n" + "\n".join(log) + "\n")
          print("done", len(out))
          EOF
      - name: Commit results
        run: |
          git config user.email "bot@example.com"
          git config user.name "bot"
          git add playlist.txt
          git commit -m "Debug continuation" || true
          git push
