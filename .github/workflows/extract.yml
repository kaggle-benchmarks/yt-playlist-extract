name: extract
on:
  workflow_dispatch:
permissions: write-all
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch and parse playlist
        run: |
          python3 - <<'EOF'
          import re, json, urllib.request

          UA = {"User-Agent": "facebookexternalhit/1.1 (+http://www.facebook.com/externalhit_uatext.php)"}
          url = "https://www.youtube.com/playlist?list=PLyzTA8cetPdHtlGw1X8Kt7Ea4bd27ApR7&hl=en"
          req = urllib.request.Request(url, headers=UA)
          html = urllib.request.urlopen(req, timeout=60).read().decode("utf-8", "replace")
          m = re.search(r'var ytInitialData = (\{.*?\});</script>', html)
          if not m:
              raise SystemExit("NO ytInitialData FOUND")
          data = json.loads(m.group(1))

          items = []
          continuations = []
          def walk(o):
              if isinstance(o, dict):
                  if o.get("contentType") == "LOCKUP_CONTENT_TYPE_VIDEO" and "contentId" in o:
                      title = None
                      try:
                          title = o["metadata"]["lockupMetadataViewModel"]["title"]["content"]
                      except Exception:
                          pass
                      items.append((o["contentId"], title))
                  if "continuationCommand" in o and isinstance(o["continuationCommand"], dict) and "token" in o["continuationCommand"]:
                      continuations.append(o["continuationCommand"]["token"])
                  if "playlistVideoRenderer" in o:
                      vr = o["playlistVideoRenderer"]
                      t = None
                      try:
                          t = vr["title"]["runs"][0]["text"]
                      except Exception:
                          pass
                      items.append((vr.get("videoId"), t))
                  for v in o.values():
                      walk(v)
              elif isinstance(o, list):
                  for v in o:
                      walk(v)
          walk(data)

          seen = set()
          out = []
          for vid, title in items:
              if vid and vid not in seen:
                  seen.add(vid)
                  out.append((vid, title))

          # follow continuation if present
          if continuations:
              token = continuations[-1]
              body = json.dumps({
                  "context": {"client": {"clientName": "WEB", "clientVersion": "2.20261023.01.00", "hl": "en", "gl": "US"}},
                  "continuation": token
              }).encode()
              api = "https://www.youtube.com/youtubei/v1/browse?key=AIzaSyAO_FJ2SlqU8Q4STEHLGCilw_Y9_11qcW8"
              req2 = urllib.request.Request(api, data=body, headers={"Content-Type": "application/json", **UA})
              resp = json.loads(urllib.request.urlopen(req2, timeout=60).read().decode("utf-8", "replace"))
              walk(resp)
              for vid, title in items:
                  if vid and vid not in seen:
                      seen.add(vid)
                      out.append((vid, title))

          with open("playlist.txt", "w") as f:
              f.write(f"TOTAL: {len(out)}\n")
              for i, (vid, title) in enumerate(out, 1):
                  f.write(f"{i}. {vid} | {title}\n")
          print("done", len(out))
          EOF
      - name: Commit results
        run: |
          git config user.email "bot@example.com"
          git config user.name "bot"
          git add playlist.txt
          git commit -m "Update playlist extraction results (with continuation)"
          git push
